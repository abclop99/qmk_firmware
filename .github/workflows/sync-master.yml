name: Sync master from upstream qmk

# Fast-forwards this fork's master branch to qmk/qmk_firmware:master (the fork
# parent) daily. master is meant to mirror upstream EXACTLY -- no local commits
# -- so this is always a clean fast-forward in normal operation.
#
# Uses `gh repo sync` (server-side: nothing cloned or pushed from the runner).
# Per its documented contract, WITHOUT --force it performs ONLY a fast-forward;
# if master ever diverged from qmk:master (a stray commit, or an upstream
# rewrite) it FAILS rather than merging or force-overwriting -- that anomaly
# wants a human, not a silent reset. (We deliberately do NOT call the raw
# merge-upstream API, which would create a MERGE commit on a clean divergence
# instead of failing.)
#
# IMPORTANT:
#   * Scheduled workflows only run from the repo's DEFAULT branch (`dev`); this
#     file must exist there for the cron to fire. This job never touches `dev`.
#   * GitHub disables scheduled workflows after ~60 days of repo inactivity and
#     emails the owner; use the manual "Run workflow" button to re-trigger.

on:
  schedule:
    - cron: '7 7 * * *'    # daily ~07:07 UTC (staggered before the hk-master mirror)
  workflow_dispatch:        # adds a manual "Run workflow" button

permissions:
  contents: write           # the fast-forward updates the master ref

concurrency:
  group: sync-master
  cancel-in-progress: false # a fast-forward is quick; let an in-flight one finish

jobs:
  sync-master:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fast-forward master from qmk/qmk_firmware:master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync "$GITHUB_REPOSITORY" --branch master
